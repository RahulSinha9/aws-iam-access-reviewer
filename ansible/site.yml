---
- name: Prepare IAM reviewer host
  hosts: reviewer
  become: true
  tasks:
    - name: Install Docker
      ansible.builtin.package:
        name: docker
        state: present
    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started
    - name: Create application directory
      ansible.builtin.file:
        path: /opt/aws-iam-access-reviewer
        state: directory
        owner: root
        group: root
        mode: "0750"
